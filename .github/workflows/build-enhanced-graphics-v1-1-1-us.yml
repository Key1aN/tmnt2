name: Build TMNT2 Core Enhanced Graphics v1.1.1 US

on:
  workflow_dispatch:
  push:
    branches:
      - "claude/enhanced-graphics-v1-1-0-us"

permissions:
  contents: write

jobs:
  build-enhanced-graphics-v1-1-0-windows-x86-us:
    runs-on: windows-2022
    timeout-minutes: 40

    steps:
      - name: Check out Enhanced Graphics v1.1.1 source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Enhanced Graphics wiring and original-path gates
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $checks = @{
            "src/Game/Sequence/DebugTools/DebugToolsProcess.cpp" = @("PAGE_REMASTER,", "CEnhancedGraphicsTab::AdjustItem(selected, direction, multiplier);", "VisiblePageNum()");
            "src/System/PC/PCModFeatures.cpp"                 = @('"feature=enhanced-graphics"', "FLAG_ENHANCED_GRAPHICS");
            "src/System/PC/PCEnhancedGraphics.cpp"            = @("s_state.m_bAvailable = CPCModFeatures::IsEnhancedGraphicsEnabled();", "if (!s_state.m_bAvailable || !s_state.m_bEnhanced)", "_rwD3D9DeviceSetReleaseCallback(DeviceReleaseCallback);", "DIK_F8");
            "src/System/PC/PCGraphicsDevice.cpp"              = @("CEnhancedGraphics::OnEngineStarted();", "CEnhancedGraphics::OnEngineStopping();", "CEnhancedGraphics::FrameBegin();");
            "src/Game/Component/GameMain/GameStage.cpp"       = @("CEnhancedGraphics::WaterDraw();", "CEnhancedGraphics::PostProcess();");
            "src/Game/System/Model/ToonManager.cpp"           = @("RestoreOriginalGradients();", "RpToonPaintSetGradientTexture(m_apRpToonPaint[i], m_apGradientEnhanced[i]);");
            "src/Game/Component/Module/CircleShadowModule.cpp" = @("if (m_bEnhancedReady && s_pSoftShadowTexture && CEnhancedGraphics::Get().m_bShadow)");
            "src/Game/System/Map/WorldMap.cpp"                = @("WaterSurface::Build(m_pWorld, m_pWorldCollision", "void CWorldMapManager::ApplyEnhancedLights(void)");
            "src/Game/System/Texture/TextureManager.cpp"      = @("rwFILTERLINEARMIPLINEAR : rwFILTERLINEAR");
          }
          foreach ($file in $checks.Keys) {
            $text = Get-Content $file -Raw
            foreach ($required in $checks[$file]) {
              if ($text -notmatch [regex]::Escape($required)) { throw "Enhanced Graphics wiring missing in ${file}: $required" }
            }
          }
          foreach ($s in @("eg_fullscreen_vs", "eg_bright_ps", "eg_blur_ps", "eg_composite_ps", "eg_water_vs", "eg_water_ps")) {
            if (-not (Test-Path "src/System/PC/Shaders/EnhancedGraphics/$s.hlsl")) { throw "Shader source missing: $s" }
          }
          $inl = Get-Content "src/System/PC/PCEnhancedGraphicsShaders.inl" -Raw
          foreach ($sym in @("g_EgFullscreenVS", "g_EgBrightPS", "g_EgBlurPS", "g_EgCompositePS", "g_EgWaterVS", "g_EgWaterPS")) {
            if ($inl -notmatch $sym) { throw "Embedded shader bytecode missing: $sym" }
          }

      - name: Stage DirectX headers and x86 libraries
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dxsdk = Join-Path $env:RUNNER_TEMP "tmnt2-dxsdk"
          $includeOut = Join-Path $dxsdk "Include"
          $libOut = Join-Path $dxsdk "Lib\x86"
          New-Item -ItemType Directory -Force -Path $includeOut, $libOut | Out-Null
          $sdkPackageVersion = "10.0.26100.7705"

          function Get-VerifiedNuGetPackage {
            param([string]$PackageName, [string]$ExpectedHash, [string]$OutputName)
            $packageUrl = "https://api.nuget.org/v3-flatcontainer/$PackageName/$sdkPackageVersion/$PackageName.$sdkPackageVersion.nupkg"
            $packageZip = Join-Path $env:RUNNER_TEMP "$OutputName.zip"
            $packageOut = Join-Path $env:RUNNER_TEMP $OutputName
            & curl.exe --location --fail --retry 3 --retry-delay 2 --output $packageZip $packageUrl
            if ($LASTEXITCODE -ne 0) { throw "Failed to download $PackageName $sdkPackageVersion." }
            $actualHash = (Get-FileHash $packageZip -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualHash -ne $ExpectedHash) { throw "$PackageName hash mismatch: $actualHash" }
            Expand-Archive -Path $packageZip -DestinationPath $packageOut -Force
            return $packageOut
          }

          $x86PackageOut = Get-VerifiedNuGetPackage `
            -PackageName "microsoft.windows.sdk.cpp.x86" `
            -ExpectedHash "4a8504308e253842054f0c385817522a895306308bf4d6dc11f09064bb27c280" `
            -OutputName "winsdk-x86"
          $kitsRoot = "${env:ProgramFiles(x86)}\Windows Kits\10"
          $d3d9Header = $null
          if (Test-Path "$kitsRoot\Include") {
            $d3d9Header = Get-ChildItem "$kitsRoot\Include" -Recurse -File -Filter "d3d9.h" |
              Where-Object { $_.DirectoryName -match "\\(shared|um)$" } |
              Sort-Object FullName -Descending | Select-Object -First 1
          }
          if ($d3d9Header) {
            $headerVersionRoot = Get-Item (Split-Path $d3d9Header.DirectoryName -Parent)
          }
          else {
            $headersPackageOut = Get-VerifiedNuGetPackage `
              -PackageName "microsoft.windows.sdk.cpp" `
              -ExpectedHash "ff455660bee071a744715a9665666fa29c07681579d3d815959a9eec5a556424" `
              -OutputName "winsdk-headers"
            $headerVersionRoot = Get-ChildItem "$headersPackageOut\c\Include" -Directory |
              Where-Object {
                (Test-Path (Join-Path $_.FullName "shared\d3d9.h")) -and
                (Test-Path (Join-Path $_.FullName "um\dinput.h")) -and
                (Test-Path (Join-Path $_.FullName "um\dsound.h"))
              } | Sort-Object Name -Descending | Select-Object -First 1
          }
          if (-not $headerVersionRoot) { throw "Required DirectX headers were not found." }
          Copy-Item "$($headerVersionRoot.FullName)\um\*" $includeOut -Recurse -Force
          Copy-Item "$($headerVersionRoot.FullName)\shared\*" $includeOut -Recurse -Force
          foreach ($library in @("d3d9.lib", "dinput8.lib", "dxguid.lib", "dsound.lib")) {
            $source = Join-Path $x86PackageOut "c\um\x86\$library"
            if (-not (Test-Path $source)) { throw "Required DirectX library was not found: $source" }
            Copy-Item $source $libOut -Force
          }
          "DXSDK_DIR=$dxsdk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure US Win32 Release Debug Tools + Enhanced Graphics build
        shell: pwsh
        run: cmake --preset vs2022 -DOPT_EU_BUILD=OFF -DOPT_DEBUG_TOOLS=ON

      - name: Build TMNT2 Core Enhanced Graphics v1.1.1 US
        shell: pwsh
        run: cmake --build --preset vs2022-release --parallel

      - name: Collect and verify uniquely named outputs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Get-ChildItem "$env:GITHUB_WORKSPACE\bin\win" -Recurse -File -Filter "TMNT2.exe" |
            Where-Object { $_.FullName -match "\\release\\" } | Select-Object -First 1
          if (-not $exe) { throw "The Release TMNT2.exe output was not found." }
          $pdb = Get-ChildItem "$env:GITHUB_WORKSPACE" -Recurse -File -Filter "TMNT2.pdb" |
            Where-Object { $_.FullName -notmatch "\\vendor\\" } | Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1
          $map = Get-ChildItem "$env:GITHUB_WORKSPACE" -Recurse -File -Filter "TMNT2.map" |
            Where-Object { $_.FullName -notmatch "\\vendor\\" } | Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1
          if (-not $pdb -or -not $map) { throw "The matching PDB or MAP was not found." }
          $exeText = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes($exe.FullName))
          foreach ($marker in @("feature=enhanced-graphics", "TMNT2_graphics.ini", "TMNT2 Enhanced Graphics v1.1.1", "BUILD TMNT2_Core_Enhanced_Graphics_v1_1_1_US", "Enhanced camera (F7)", "CAMERA OVERHAUL", "v1.2.24", "REMASTER", "Save to TMNT2_graphics.ini")) {
            if (-not $exeText.Contains($marker)) { throw "Marker missing from the EXE: $marker" }
          }
          $artifactDir = Join-Path $env:GITHUB_WORKSPACE "artifact-enhanced-graphics-v1-1-0-us"
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null
          $baseName = "TMNT2_Core_Enhanced_Graphics_v1_1_1_US"
          Copy-Item $exe.FullName (Join-Path $artifactDir "$baseName.exe") -Force
          Copy-Item $pdb.FullName (Join-Path $artifactDir "$baseName.pdb") -Force
          Copy-Item $map.FullName (Join-Path $artifactDir "$baseName.map") -Force
          Copy-Item "$env:GITHUB_WORKSPACE\ENHANCED_GRAPHICS_V1_1_1_US.md" $artifactDir -Force
          Get-ChildItem $artifactDir -File | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLowerInvariant())  $($_.Path | Split-Path -Leaf)" } |
            Set-Content (Join-Path $artifactDir "SHA256SUMS.txt") -Encoding utf8

      - name: Publish build outputs to drop branch for packaging
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $drop = Join-Path $env:RUNNER_TEMP "drop"
          New-Item -ItemType Directory -Force -Path $drop | Out-Null
          Copy-Item "$env:GITHUB_WORKSPACE\artifact-enhanced-graphics-v1-1-0-us\*" $drop -Force
          Set-Location $drop
          git init -q
          git config core.autocrlf false
          "* -text" | Set-Content .gitattributes
          git checkout -q -b drop
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -q -m "Build outputs for $env:GITHUB_SHA (run $env:GITHUB_RUN_NUMBER)"
          git push -q -f "https://x-access-token:$env:GH_TOKEN@github.com/$env:GITHUB_REPOSITORY.git" drop:refs/heads/build-drops/enhanced-graphics-v1-1-0-us

      - name: Upload TMNT2 Core Enhanced Graphics v1.1.1 US artifact
        uses: actions/upload-artifact@v4
        with:
          name: TMNT2-Core-Enhanced-Graphics-v1-1-0-US-run-${{ github.run_number }}
          path: artifact-enhanced-graphics-v1-1-0-us/*
          if-no-files-found: error
          retention-days: 14
