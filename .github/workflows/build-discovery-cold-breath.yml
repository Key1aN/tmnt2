name: Build cold breath and developer discovery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-x86-us:
    runs-on: windows-2022
    timeout-minutes: 40

    steps:
      - name: Check out patched source
        uses: actions/checkout@v4

      - name: Stage DirectX headers and x86 libraries
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $dxsdk = Join-Path $env:RUNNER_TEMP "tmnt2-dxsdk"
          $includeOut = Join-Path $dxsdk "Include"
          $libOut = Join-Path $dxsdk "Lib\x86"
          New-Item -ItemType Directory -Force -Path $includeOut, $libOut | Out-Null

          $sdkPackageVersion = "10.0.26100.7705"

          function Get-VerifiedNuGetPackage {
            param(
              [string]$PackageName,
              [string]$ExpectedHash,
              [string]$OutputName
            )

            $packageUrl = "https://api.nuget.org/v3-flatcontainer/$PackageName/$sdkPackageVersion/$PackageName.$sdkPackageVersion.nupkg"
            $packageZip = Join-Path $env:RUNNER_TEMP "$OutputName.zip"
            $packageOut = Join-Path $env:RUNNER_TEMP $OutputName

            & curl.exe --location --fail --retry 3 --retry-delay 2 --output $packageZip $packageUrl
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to download $PackageName $sdkPackageVersion."
            }

            $actualHash = (Get-FileHash $packageZip -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualHash -ne $ExpectedHash) {
              throw "$PackageName hash mismatch: $actualHash"
            }

            Expand-Archive -Path $packageZip -DestinationPath $packageOut -Force
            return $packageOut
          }

          $x86PackageOut = Get-VerifiedNuGetPackage `
            -PackageName "microsoft.windows.sdk.cpp.x86" `
            -ExpectedHash "4a8504308e253842054f0c385817522a895306308bf4d6dc11f09064bb27c280" `
            -OutputName "winsdk-x86"

          $kitsRoot = "${env:ProgramFiles(x86)}\Windows Kits\10"
          $d3d9Header = $null
          if (Test-Path "$kitsRoot\Include") {
            $d3d9Header = Get-ChildItem "$kitsRoot\Include" -Recurse -File -Filter "d3d9.h" |
              Where-Object { $_.DirectoryName -match "\\(shared|um)$" } |
              Sort-Object FullName -Descending |
              Select-Object -First 1
          }

          if ($d3d9Header) {
            $headerVersionRoot = Get-Item (Split-Path $d3d9Header.DirectoryName -Parent)
          }
          else {
            Write-Host "The runner SDK has no DirectX 9 headers; downloading Microsoft's SDK header package."
            $headersPackageOut = Get-VerifiedNuGetPackage `
              -PackageName "microsoft.windows.sdk.cpp" `
              -ExpectedHash "ff455660bee071a744715a9665666fa29c07681579d3d815959a9eec5a556424" `
              -OutputName "winsdk-headers"

            $headerVersionRoot = Get-ChildItem "$headersPackageOut\c\Include" -Directory |
              Where-Object {
                (Test-Path (Join-Path $_.FullName "shared\d3d9.h")) -and
                (Test-Path (Join-Path $_.FullName "um\dinput.h")) -and
                (Test-Path (Join-Path $_.FullName "um\dsound.h"))
              } |
              Sort-Object Name -Descending |
              Select-Object -First 1
          }

          if (-not $headerVersionRoot) {
            throw "The Microsoft Windows SDK package did not contain the required DirectX headers."
          }

          Copy-Item "$($headerVersionRoot.FullName)\um\*" $includeOut -Recurse -Force
          Copy-Item "$($headerVersionRoot.FullName)\shared\*" $includeOut -Recurse -Force

          foreach ($library in @("d3d9.lib", "dinput8.lib", "dxguid.lib", "dsound.lib")) {
            $source = Join-Path $x86PackageOut "c\um\x86\$library"
            if (-not (Test-Path $source)) {
              throw "Required DirectX library was not found: $source"
            }
            Copy-Item $source $libOut -Force
          }

          foreach ($header in @("d3d9.h", "dinput.h", "dsound.h")) {
            if (-not (Test-Path (Join-Path $includeOut $header))) {
              throw "Required DirectX header was not staged: $header"
            }
          }

          "DXSDK_DIR=$dxsdk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure US Win32 build
        shell: pwsh
        run: cmake --preset vs2022 -DOPT_EU_BUILD=OFF

      - name: Build normal cold-breath executable
        shell: pwsh
        run: cmake --build --preset vs2022-release --parallel

      - name: Build Developer Discovery executable
        shell: pwsh
        run: cmake --build --preset vs2022-debug --parallel

      - name: Collect and verify both executables
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          function Find-BuildFile {
            param([string]$Configuration, [string]$Filter)

            $separator = [System.IO.Path]::DirectorySeparatorChar
            $match = "$separator$($Configuration.ToLowerInvariant())$separator"
            return Get-ChildItem "$env:GITHUB_WORKSPACE\bin\win" -Recurse -File -Filter $Filter |
              Where-Object { $_.FullName.ToLowerInvariant().Contains($match) } |
              Select-Object -First 1
          }

          $releaseExe = Find-BuildFile -Configuration "release" -Filter "TMNT2.exe"
          $debugExe = Find-BuildFile -Configuration "debug" -Filter "TMNT2.exe"
          if (-not $releaseExe) { throw "The Release TMNT2.exe output was not found." }
          if (-not $debugExe) { throw "The Debug TMNT2.exe output was not found." }

          $artifactDir = Join-Path $env:GITHUB_WORKSPACE "artifact-discovery"
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null

          $releaseOut = Join-Path $artifactDir "TMNT2_Cold_Breath_US.exe"
          $debugOut = Join-Path $artifactDir "TMNT2_Developer_Discovery_US.exe"
          Copy-Item $releaseExe.FullName $releaseOut -Force
          Copy-Item $debugExe.FullName $debugOut -Force
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE "DISCOVERY_COLD_BREATH.md") $artifactDir -Force

          $releasePdb = Join-Path $releaseExe.DirectoryName "TMNT2.pdb"
          $debugPdb = Join-Path $debugExe.DirectoryName "TMNT2.pdb"
          if (Test-Path $releasePdb) { Copy-Item $releasePdb (Join-Path $artifactDir "TMNT2_Cold_Breath_US.pdb") -Force }
          if (Test-Path $debugPdb) { Copy-Item $debugPdb (Join-Path $artifactDir "TMNT2_Developer_Discovery_US.pdb") -Force }

          $commit = git rev-parse HEAD
          $releaseHash = (Get-FileHash $releaseOut -Algorithm SHA256).Hash.ToLowerInvariant()
          $debugHash = (Get-FileHash $debugOut -Algorithm SHA256).Hash.ToLowerInvariant()

          @(
            "Build=US/NA x86 Release + Debug",
            "SourceCommit=$commit",
            "NormalExecutable=$([System.IO.Path]::GetFileName($releaseOut))",
            "NormalSize=$((Get-Item $releaseOut).Length)",
            "NormalSHA256=$releaseHash",
            "DiscoveryExecutable=$([System.IO.Path]::GetFileName($debugOut))",
            "DiscoverySize=$((Get-Item $debugOut).Length)",
            "DiscoverySHA256=$debugHash"
          ) | Set-Content (Join-Path $artifactDir "BUILD_INFO.txt") -Encoding utf8

          Get-Content (Join-Path $artifactDir "BUILD_INFO.txt")

      - name: Upload cold-breath and Discovery builds
        uses: actions/upload-artifact@v4
        with:
          name: TMNT2-Cold-Breath-and-Developer-Discovery-US
          path: artifact-discovery/*
          if-no-files-found: error
          retention-days: 7
