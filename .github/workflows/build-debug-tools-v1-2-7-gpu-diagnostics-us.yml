name: Build TMNT2 Core Debug Tools v1.2.7 GPU Diagnostics US

on:
  workflow_dispatch:
  push:
    branches:
      - "claude/debug-tools-v1-2-7-gpu-diagnostics-us"

permissions:
  contents: write

jobs:
  build-debug-tools-v1-2-7-gpu-diagnostics-windows-x86-us:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Check out Debug Tools v1.2.7 source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact extension scope
        shell: pwsh
        run: |
          $expected = @(
            ".github/workflows/build-karai-boss-variant-v1-1-1-us.yml",
            ".github/workflows/build-debug-tools-v1-2-7-gpu-diagnostics-us.yml",
            ".github/workflows/build-karai-boss-variant-v1-3-0-us.yml",
            ".github/workflows/build-karai-v1-2-0-combo-assist-v1-us.yml",
            ".github/workflows/build-karai-boss-variant-v2-us.yml",
            "DEBUG_TOOLS_V1_2_7_US.md",
            "KARAI_BOSS_VARIANT_V1_1_1_US.md",
            "KARAI_BOSS_VARIANT_V1_3_0_US.md",
            "KARAI_V1_2_0_COMBO_ASSIST_V1_US.md",
            "KARAI_BOSS_VARIANT_V2_US.md",
            "scripts/lpacview/build_karai_boss_variant_lpac.py",
            "src/Game/Component/Player/ConcretePlayerCharacter/Karai.cpp",
            "src/Game/Component/Player/ConcretePlayerCharacter/Karai.hpp",
            "src/Game/Component/Gauge/GaugeManager.cpp",
            "src/Game/Sequence/DebugTools/DebugToolsProcess.cpp",
            "src/Game/Component/Player/ConcreteManipulator/ManipulatorKarai.cpp",
            "src/Game/Component/Player/ConcreteManipulator/ManipulatorKarai.hpp",
            "src/Game/Component/Player/ConcretePlayerStatus/PlayerStatusDamage.cpp",
            "src/Game/Component/Player/Manipulator.cpp",
            "src/Game/Component/Player/Manipulator.hpp",
            "src/Game/Component/Player/PlayerCharacter.cpp",
            "src/Game/Sequence/Menu/CharacterSelectSequence.cpp",
            "src/Game/System/Character/Character.cpp",
            "src/Game/System/Character/Character.hpp",
            "src/Game/System/Model/ModelManager.cpp",
            "src/Game/System/Model/ModelManager.hpp",
            "src/Game/System/MotionParameter/MotionParameterManager.cpp",
            "src/Game/System/MotionParameter/MotionParameterManager.hpp",
            "src/System/PC/PCFrameStats.cpp",
            "src/System/PC/PCFramework.cpp",
            "src/System/PC/PCGraphicsDevice.cpp",
            "src/System/PC/PCGraphicsDevice.hpp",
            "src/System/PC/PCModFeatures.cpp",
            "src/System/PC/PCModFeatures.hpp",
            "src/System/PC/main.cpp"
          )
          # 9027a9b is Debug Tools v1.2.6 (boss labels), the cumulative baseline.
          $changed = @(git diff --name-only 9027a9b HEAD)
          $unexpected = @($changed | Where-Object { $_ -notin $expected })
          $missing = @($expected | Where-Object { $_ -notin $changed })
          if ($unexpected.Count -ne 0 -or $missing.Count -ne 0) {
            throw "Karai boss variant scope mismatch. Unexpected: $($unexpected -join ', '); missing: $($missing -join ', ')"
          }

      - name: Verify local DirectInput horizontal correction
        shell: pwsh
        run: |
          $physicalCpp = Get-Content "src/System/PC/PCPhysicalController.cpp" -Raw
          $physicalHpp = Get-Content "src/System/PC/PCPhysicalController.hpp" -Raw
          $camera = Get-Content "src/Game/System/Map/MapCamera.cpp" -Raw
          $tools = Get-Content "src/Game/Sequence/DebugTools/DebugToolsProcess.cpp" -Raw

          foreach ($required in @(
            "GetDebugRightStickHorizontal",
            "ClampValue(-1 - m_joystate.lZ, DEADZONE)",
            "ANALOG_RSTICK_Y]",
            "ClampValue(-1 - m_joystate.rglSlider[0], DEADZONE)"
          )) {
            if (($physicalCpp + $physicalHpp) -notmatch [regex]::Escape($required)) {
              throw "Missing controller requirement: $required"
            }
          }

          foreach ($required in @(
            "CPCPhysicalController::GetDebugRightStickHorizontal()",
            "ry = -static_cast<float>(GetDebugControllerAnalog(CController::ANALOG_RSTICK_X))",
            "float radiusScale = nextRadius / radius",
            "m_fDist *= radiusScale",
            "m_fHeight *= radiusScale"
          )) {
            if ($camera -notmatch [regex]::Escape($required)) {
              throw "Missing Debug Camera behavior: $required"
            }
          }

          foreach ($required in @(
            "int16 rightX = CPCPhysicalController::GetDebugRightStickHorizontal()",
            "int16 rightY = ControllerAnalog(CController::ANALOG_RSTICK_X)"
          )) {
            if ($tools -notmatch [regex]::Escape($required)) {
              throw "Missing menu-closed showcase behavior: $required"
            }
          }

          foreach ($forbidden in @(
            "PCDebugController",
            "PAGE_CONTROLLER",
            "ControllerProfiles.ini",
            "m_fShowcaseRadius",
            "m_fShowcasePitch"
          )) {
            $found = $false
            foreach ($sourceFile in Get-ChildItem src -Recurse -File -Include *.c,*.cpp,*.h,*.hpp) {
              if ((Get-Content $sourceFile.FullName -Raw) -match [regex]::Escape($forbidden)) {
                $found = $true
                break
              }
            }
            if ($found) { throw "Rejected v1.3 behavior is present: $forbidden" }
          }

      - name: Verify real frame timing and move telemetry
        shell: pwsh
        run: |
          $stats = (Get-Content "src/System/PC/PCFrameStats.cpp" -Raw) + (Get-Content "src/System/PC/PCFrameStats.hpp" -Raw)
          $system = Get-Content "src/System/PC/PCSystem.cpp" -Raw
          $framework = Get-Content "src/System/PC/PCFramework.cpp" -Raw
          $tools = Get-Content "src/Game/Sequence/DebugTools/DebugToolsProcess.cpp" -Raw
          foreach ($required in @("QueryPerformanceCounter", "TMNT2_DEBUG_TOOLS")) {
            if ($stats -notmatch [regex]::Escape($required)) { throw "Frame stats missing: $required" }
          }
          foreach ($required in @("CPCFrameStats::FrameBegin()", "CPCFrameStats::UpdateDone()", "CPCFrameStats::RenderDone()", "CPCFrameStats::FrameEnd()")) {
            if ($system -notmatch [regex]::Escape($required)) { throw "Main loop timing hook missing: $required" }
          }
          if ($framework -notmatch [regex]::Escape("CPCFrameStats::SetDrawSkipped(m_pFrameSkipController->IsSkip())")) {
            throw "Frame-skip recording hook missing."
          }
          foreach ($required in @("TMNT2_perf.log", "TMNT2_moves.log", "DrawFrameGraph", "DrawEnemyLabels", "CGameFont::Show(line1", "m_fLabelSize", "m_fLabelLift", "ComputeFrameWindow", "LABELMODE_BOSSES")) {
            if ($tools -notmatch [regex]::Escape($required)) { throw "Debug Tools v1.2.6 feature missing: $required" }
          }
          if ($tools -match [regex]::Escape('m_font.Print("FPS %.1f  Frame %.2f ms", CScreen::Framerate()')) {
            throw "The nominal (fake) FPS readout is still present."
          }

      - name: Verify Karai boss variant wiring
        shell: pwsh
        run: |
          $karai = Get-Content "src/Game/Component/Player/ConcretePlayerCharacter/Karai.cpp" -Raw
          $chr = Get-Content "src/Game/System/Character/Character.cpp" -Raw
          $sel = Get-Content "src/Game/Sequence/Menu/CharacterSelectSequence.cpp" -Raw
          $feat = Get-Content "src/System/PC/PCModFeatures.cpp" -Raw
          foreach ($required in @('"karai_boss"', "IsKaraiBossVariantEnabled", "SetMotionAliasTable", "IsModelLoaded", "IsCharacterParameterLoaded")) {
            if ($karai -notmatch [regex]::Escape($required)) { throw "Karai variant missing: $required" }
          }
          if ($chr -notmatch [regex]::Escape("pszMotionName = ResolveMotionName(pszMotionName);")) { throw "Motion fallback hook missing." }
          if ($chr -notmatch [regex]::Escape("if (m_bRemapEnemyAttackData)")) { throw "Enemy attack data remap missing." }
          $man = Get-Content "src/Game/Component/Player/ConcreteManipulator/ManipulatorKarai.cpp" -Raw
          foreach ($required in @("STATUS_BOSS_THUNDER", "STATUS_BOSS_DASH_STRIKE", "RequestWindPressFollowup", "RunAttackBCharge", "STATUS_BOSS_AAA", "STATUS_BOSS_COUNTER_STANCE", "STATUS_BOSS_KUNAI_FAN", "STATUS_BOSS_KUNAI_RAIN", "STATUS_BOSS_COUNTER_SLASH", "STATUS_BOSS_BACK_AWAY", "IsBossVariant()")) {
            if ($man -notmatch [regex]::Escape($required)) { throw "Karai boss move input missing: $required" }
          }
          foreach ($required in @("class CBossThunder", "class CBossWindPress", "class CBossAttackB", "class CBossAttackBCharge", "class CBossAttackKnife", "class CBossCounterStance", "class CBossKunaiFan", "THUNDER_COOLDOWN_WARNING = 3.5f", "STATUS_BOSS_MAX")) {
            if ((Get-Content "src/Game/Component/Player/ConcretePlayerCharacter/Karai.hpp" -Raw) -notmatch [regex]::Escape($required)) { throw "Karai boss move status missing: $required" }
          }
          if ((Get-Content "src/Game/Component/Player/ConcretePlayerStatus/PlayerStatusDamage.cpp" -Raw) -notmatch [regex]::Escape("(Character().GetID() == PLAYERID::ID_KAR)")) { throw "Karai-only damage interrupt rule missing." }
          if ($sel -notmatch [regex]::Escape("case PLAYERID::ID_KAR:")) { throw "Karai R1 selection missing." }
          if ($feat -notmatch [regex]::Escape("feature=karai-boss-variant")) { throw "karai-boss-variant feature gate missing." }
          if ($karai -match [regex]::Escape('{ "Shuriken",       "D"')) { throw "Plain Shuriken is still aliased to Counter Slash." }
          $manip = Get-Content "src/Game/Component/Player/Manipulator.cpp" -Raw
          foreach ($required in @("IsChordWithHeldButton", "CHORD_WINDOW", "UpdateChordTimers")) {
            if ($manip -notmatch [regex]::Escape($required)) { throw "A+B chord window missing: $required" }
          }
          if ($manip -notmatch [regex]::Escape("IsComboAssistEnabled()")) { throw "A+B window is not gated by combo-assist." }
          $pc = Get-Content "src/Game/Component/Player/PlayerCharacter.cpp" -Raw
          foreach ($required in @("COMBO_LATE_WINDOW", "IsComboAssistEnabled()")) {
            if ($pc -notmatch [regex]::Escape($required)) { throw "Combo late window missing: $required" }
          }
          if ($feat -notmatch [regex]::Escape("feature=combo-assist")) { throw "combo-assist feature gate missing." }
          foreach ($required in @("UpdateBossPhase", "ID_I_CRYSHINE_R", "ID_SETUP_ATTACK", "DrawBossHud", "THUNDER_HOLD_START")) {
            if ($karai -notmatch [regex]::Escape($required)) { throw "Karai v1.3.0 feature missing: $required" }
          }
          if ((Get-Content "src/Game/Component/Gauge/GaugeManager.cpp" -Raw) -notmatch [regex]::Escape("CKarai::DrawBossHud()")) { throw "Thunder countdown HUD hook missing." }
          $mainSrc = Get-Content "src/System/PC/main.cpp" -Raw
          foreach ($required in @("NvOptimusEnablement", "AmdPowerXpressRequestHighPerformance")) {
            if ($mainSrc -notmatch [regex]::Escape($required)) { throw "Dedicated GPU export missing: $required" }
          }
          if ((Get-Content "src/System/PC/PCGraphicsDevice.cpp" -Raw) -notmatch [regex]::Escape("GetAdapterIdentifier")) { throw "GPU identification missing." }
          $tools = Get-Content "src/Game/Sequence/DebugTools/DebugToolsProcess.cpp" -Raw
          foreach ($required in @("PERF_SUMMARY_SPAN_MS", "WriteDisplayLine", "DEBUGTOOLS attach")) {
            if ($tools -notmatch [regex]::Escape($required)) { throw "Debug Tools v1.2.7 feature missing: $required" }
          }

      - name: Verify EXE-only feature boundaries
        shell: pwsh
        run: |
          $changed = @(git diff --name-only 9027a9b HEAD)
          $retailInputs = @($changed | Where-Object {
            $_ -match '(^|/)(TMNT2\.exe|TMNT\.DAT)$' -or
            $_ -match '(^|/)(lpac|LPAC)(/|$)'
          })
          if ($retailInputs.Count -ne 0) {
            throw "Retail DAT, EXE, or LPAC input entered the source change: $($retailInputs -join ', ')"
          }
          if ((Get-Content "src/System/PC/PCModFeatures.cpp" -Raw) -notmatch 'feature=debug-tools-f4') {
            throw "The debug-tools-f4 runtime feature gate is missing."
          }

      - name: Stage DirectX headers and x86 libraries
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dxsdk = Join-Path $env:RUNNER_TEMP "tmnt2-dxsdk"
          $includeOut = Join-Path $dxsdk "Include"
          $libOut = Join-Path $dxsdk "Lib\x86"
          New-Item -ItemType Directory -Force -Path $includeOut, $libOut | Out-Null
          $sdkPackageVersion = "10.0.26100.7705"

          function Get-VerifiedNuGetPackage {
            param([string]$PackageName, [string]$ExpectedHash, [string]$OutputName)
            $packageUrl = "https://api.nuget.org/v3-flatcontainer/$PackageName/$sdkPackageVersion/$PackageName.$sdkPackageVersion.nupkg"
            $packageZip = Join-Path $env:RUNNER_TEMP "$OutputName.zip"
            $packageOut = Join-Path $env:RUNNER_TEMP $OutputName
            & curl.exe --location --fail --retry 3 --retry-delay 2 --output $packageZip $packageUrl
            if ($LASTEXITCODE -ne 0) { throw "Failed to download $PackageName $sdkPackageVersion." }
            $actualHash = (Get-FileHash $packageZip -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualHash -ne $ExpectedHash) { throw "$PackageName hash mismatch: $actualHash" }
            Expand-Archive -Path $packageZip -DestinationPath $packageOut -Force
            return $packageOut
          }

          $x86PackageOut = Get-VerifiedNuGetPackage `
            -PackageName "microsoft.windows.sdk.cpp.x86" `
            -ExpectedHash "4a8504308e253842054f0c385817522a895306308bf4d6dc11f09064bb27c280" `
            -OutputName "winsdk-x86"
          $kitsRoot = "${env:ProgramFiles(x86)}\Windows Kits\10"
          $d3d9Header = $null
          if (Test-Path "$kitsRoot\Include") {
            $d3d9Header = Get-ChildItem "$kitsRoot\Include" -Recurse -File -Filter "d3d9.h" |
              Where-Object { $_.DirectoryName -match "\\(shared|um)$" } |
              Sort-Object FullName -Descending | Select-Object -First 1
          }
          if ($d3d9Header) {
            $headerVersionRoot = Get-Item (Split-Path $d3d9Header.DirectoryName -Parent)
          }
          else {
            $headersPackageOut = Get-VerifiedNuGetPackage `
              -PackageName "microsoft.windows.sdk.cpp" `
              -ExpectedHash "ff455660bee071a744715a9665666fa29c07681579d3d815959a9eec5a556424" `
              -OutputName "winsdk-headers"
            $headerVersionRoot = Get-ChildItem "$headersPackageOut\c\Include" -Directory |
              Where-Object {
                (Test-Path (Join-Path $_.FullName "shared\d3d9.h")) -and
                (Test-Path (Join-Path $_.FullName "um\dinput.h")) -and
                (Test-Path (Join-Path $_.FullName "um\dsound.h"))
              } | Sort-Object Name -Descending | Select-Object -First 1
          }
          if (-not $headerVersionRoot) { throw "Required DirectX headers were not found." }
          Copy-Item "$($headerVersionRoot.FullName)\um\*" $includeOut -Recurse -Force
          Copy-Item "$($headerVersionRoot.FullName)\shared\*" $includeOut -Recurse -Force
          foreach ($library in @("d3d9.lib", "dinput8.lib", "dxguid.lib", "dsound.lib")) {
            $source = Join-Path $x86PackageOut "c\um\x86\$library"
            if (-not (Test-Path $source)) { throw "Required DirectX library was not found: $source" }
            Copy-Item $source $libOut -Force
          }
          "DXSDK_DIR=$dxsdk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure US Win32 Release Karai boss variant build
        shell: pwsh
        run: cmake --preset vs2022 -DOPT_EU_BUILD=OFF -DOPT_DEBUG_TOOLS=ON

      - name: Build TMNT2 Core Debug Tools v1.2.7 GPU Diagnostics US
        shell: pwsh
        run: cmake --build --preset vs2022-release --parallel

      - name: Collect and verify uniquely named outputs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Get-ChildItem "$env:GITHUB_WORKSPACE\bin\win" -Recurse -File -Filter "TMNT2.exe" |
            Where-Object { $_.FullName -match "\\release\\" } | Select-Object -First 1
          if (-not $exe) { throw "The Release TMNT2.exe output was not found." }
          $pdb = Get-ChildItem "$env:GITHUB_WORKSPACE" -Recurse -File -Filter "TMNT2.pdb" |
            Where-Object { $_.FullName -notmatch "\\vendor\\" } |
            Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1
          $map = Get-ChildItem "$env:GITHUB_WORKSPACE" -Recurse -File -Filter "TMNT2.map" |
            Where-Object { $_.FullName -notmatch "\\vendor\\" } |
            Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1
          if (-not $pdb -or -not $map) { throw "The matching PDB or MAP was not found." }

          $artifactDir = Join-Path $env:GITHUB_WORKSPACE "artifact-debug-tools-v1-2-7-gpu-diagnostics-us"
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null
          $baseName = "TMNT2_Core_Debug_Tools_v1_2_7_US"
          Copy-Item $exe.FullName (Join-Path $artifactDir "$baseName.exe") -Force
          Copy-Item $pdb.FullName (Join-Path $artifactDir "$baseName.pdb") -Force
          Copy-Item $map.FullName (Join-Path $artifactDir "$baseName.map") -Force
          Copy-Item "$env:GITHUB_WORKSPACE\DEBUG_TOOLS_V1_2_7_US.md" $artifactDir -Force
          Get-ChildItem $artifactDir -File | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLowerInvariant())  $($_.Path | Split-Path -Leaf)" } |
            Set-Content (Join-Path $artifactDir "SHA256SUMS.txt") -Encoding utf8

      - name: Publish build outputs to drop branch for packaging
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $drop = Join-Path $env:RUNNER_TEMP "drop"
          New-Item -ItemType Directory -Force -Path $drop | Out-Null
          Copy-Item "$env:GITHUB_WORKSPACE\artifact-debug-tools-v1-2-7-gpu-diagnostics-us\*" $drop -Force
          Set-Location $drop
          git init -q
          git config core.autocrlf false
          "* -text" | Set-Content .gitattributes
          git checkout -q -b drop
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -q -m "Build outputs for $env:GITHUB_SHA (run $env:GITHUB_RUN_NUMBER)"
          git push -q -f "https://x-access-token:$env:GH_TOKEN@github.com/$env:GITHUB_REPOSITORY.git" drop:refs/heads/build-drops/debug-tools-v1-2-7-gpu-diagnostics-us

      - name: Upload TMNT2 Core Debug Tools v1.2.7 GPU Diagnostics US artifact
        uses: actions/upload-artifact@v4
        with:
          name: TMNT2-Core-Debug-Tools-v1-2-7-US-run-${{ github.run_number }}
          path: artifact-debug-tools-v1-2-7-gpu-diagnostics-us/*
          if-no-files-found: error
          retention-days: 14
